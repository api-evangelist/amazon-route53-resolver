tags:
- name: '#X Amz Target=Route53Resolver.AssociateResolverQueryLogConfig'
paths:
  /#X-Amz-Target=Route53Resolver.AssociateResolverQueryLogConfig:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: AssociateResolverQueryLogConfig
      description: 'Associates an Amazon VPC with a specified query logging configuration. Route 53 Resolver logs DNS queries that originate in all of the Amazon VPCs that are associated with a specified query logging configuration. To associate more than one VPC with a configuration, submit one AssociateResolverQueryLogConfig request for each VPC.


        The VPCs that you associate with a query logging configuration must be in the same Region as the configuration.


        To remove a VPC from a query logging configuration, see DisassociateResolverQueryLogConfig.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateResolverQueryLogConfigResponse'
        '480':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '483':
          description: ResourceExistsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceExistsException'
        '484':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '485':
          description: InternalServiceErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceErrorException'
        '486':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '487':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociateResolverQueryLogConfigRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - Route53Resolver.AssociateResolverQueryLogConfig
      tags:
      - '#X Amz Target=Route53Resolver.AssociateResolverQueryLogConfig'
      summary: Associate resolver query log config
      x-summary-source: derived
components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
    InternalServiceErrorException: {}
    InvalidRequestException: {}
    ResolverQueryLogConfigAssociationStatus:
      type: string
      enum:
      - CREATING
      - ACTIVE
      - ACTION_NEEDED
      - DELETING
      - FAILED
    AssociateResolverQueryLogConfigRequest:
      type: object
      required:
      - ResolverQueryLogConfigId
      - ResourceId
      title: AssociateResolverQueryLogConfigRequest
      properties:
        ResolverQueryLogConfigId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the query logging configuration that you want to associate a VPC with.
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: <p>The ID of an Amazon VPC that you want this query logging configuration to log queries for.</p> <note> <p>The VPCs and the query logging configuration must be in the same Region.</p> </note>
    LimitExceededException: {}
    AssociateResolverQueryLogConfigResponse:
      type: object
      properties:
        ResolverQueryLogConfigAssociation:
          allOf:
          - $ref: '#/components/schemas/ResolverQueryLogConfigAssociation'
          - description: A complex type that contains settings for a specified association between an Amazon VPC and a query logging configuration.
    ResolverQueryLogConfigAssociation:
      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the query logging association.
        ResolverQueryLogConfigId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the query logging configuration that a VPC is associated with.
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the Amazon VPC that is associated with the query logging configuration.
        Status:
          allOf:
          - $ref: '#/components/schemas/ResolverQueryLogConfigAssociationStatus'
          - description: '<p>The status of the specified query logging association. Valid values include the following:</p> <ul> <li> <p> <code>CREATING</code>: Resolver is creating an association between an Amazon VPC and a query logging configuration.</p> </li> <li> <p> <code>CREATED</code>: The association between an Amazon VPC and a query logging configuration was successfully created. Resolver is logging queries that originate in the specified VPC.</p> </li> <li> <p> <code>DELETING</code>: Resolver is deleting this query logging association.</p> </li> <li> <p> <code>FAILED</code>: Resolver either couldn''t create or couldn''t delete the query logging association.</p> </li> </ul>'
        Error:
          allOf:
          - $ref: '#/components/schemas/ResolverQueryLogConfigAssociationError'
          - description: '<p>If the value of <code>Status</code> is <code>FAILED</code>, the value of <code>Error</code> indicates the cause:</p> <ul> <li> <p> <code>DESTINATION_NOT_FOUND</code>: The specified destination (for example, an Amazon S3 bucket) was deleted.</p> </li> <li> <p> <code>ACCESS_DENIED</code>: Permissions don''t allow sending logs to the destination.</p> </li> </ul> <p>If the value of <code>Status</code> is a value other than <code>FAILED</code>, <code>Error</code> is null. </p>'
        ErrorMessage:
          allOf:
          - $ref: '#/components/schemas/ResolverQueryLogConfigAssociationErrorMessage'
          - description: Contains additional information about the error. If the value or <code>Error</code> is null, the value of <code>ErrorMessage</code> also is null.
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Rfc3339TimeString'
          - description: The date and time that the VPC was associated with the query logging configuration, in Unix time format and Coordinated Universal Time (UTC).
      description: In the response to an <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_AssociateResolverQueryLogConfig.html">AssociateResolverQueryLogConfig</a>, <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_DisassociateResolverQueryLogConfig.html">DisassociateResolverQueryLogConfig</a>, <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_GetResolverQueryLogConfigAssociation.html">GetResolverQueryLogConfigAssociation</a>, or <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_ListResolverQueryLogConfigAssociations.html">ListResolverQueryLogConfigAssociations</a>, request, a complex type that contains settings for a specified association between an Amazon VPC and a query logging configuration.
    ThrottlingException: {}
    ResourceNotFoundException: {}
    Rfc3339TimeString:
      type: string
      minLength: 20
      maxLength: 40
    ResolverQueryLogConfigAssociationError:
      type: string
      enum:
      - NONE
      - DESTINATION_NOT_FOUND
      - ACCESS_DENIED
      - INTERNAL_SERVICE_ERROR
    ResourceExistsException: {}
    AccessDeniedException: {}
    InvalidParameterException: {}
    ResolverQueryLogConfigAssociationErrorMessage:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/route53resolver/
