security:
- hmac: []
tags:
- name: '#X Amz Target=Route53Resolver.DisassociateResolverRule'
paths:
  /#X-Amz-Target=Route53Resolver.DisassociateResolverRule:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DisassociateResolverRule
      description: 'Removes the association between a specified Resolver rule and a specified VPC.


        If you disassociate a Resolver rule from a VPC, Resolver stops forwarding DNS queries for the domain name that you specified in the Resolver rule.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisassociateResolverRuleResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
        '482':
          description: InternalServiceErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceErrorException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisassociateResolverRuleRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - Route53Resolver.DisassociateResolverRule
      tags:
      - '#X Amz Target=Route53Resolver.DisassociateResolverRule'
      summary: Disassociate resolver rule
      x-summary-source: derived
components:
  schemas:
    StatusMessage:
      type: string
      maxLength: 255
    ResolverRuleAssociationStatus:
      type: string
      enum:
      - CREATING
      - COMPLETE
      - DELETING
      - FAILED
      - OVERRIDDEN
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
    DisassociateResolverRuleRequest:
      type: object
      required:
      - VPCId
      - ResolverRuleId
      title: DisassociateResolverRuleRequest
      properties:
        VPCId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the VPC that you want to disassociate the Resolver rule from.
        ResolverRuleId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the Resolver rule that you want to disassociate from the specified VPC.
    ThrottlingException: {}
    InternalServiceErrorException: {}
    DisassociateResolverRuleResponse:
      type: object
      properties:
        ResolverRuleAssociation:
          allOf:
          - $ref: '#/components/schemas/ResolverRuleAssociation'
          - description: Information about the <code>DisassociateResolverRule</code> request, including the status of the request.
    InvalidParameterException: {}
    ResourceNotFoundException: {}
    ResolverRuleAssociation:
      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the association between a Resolver rule and a VPC. Resolver assigns this value when you submit an <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_AssociateResolverRule.html">AssociateResolverRule</a> request.
        ResolverRuleId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the Resolver rule that you associated with the VPC that is specified by <code>VPCId</code>.
        Name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: The name of an association between a Resolver rule and a VPC.
        VPCId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the VPC that you associated the Resolver rule with.
        Status:
          allOf:
          - $ref: '#/components/schemas/ResolverRuleAssociationStatus'
          - description: A code that specifies the current status of the association between a Resolver rule and a VPC.
        StatusMessage:
          allOf:
          - $ref: '#/components/schemas/StatusMessage'
          - description: A detailed description of the status of the association between a Resolver rule and a VPC.
      description: 'In the response to an <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_AssociateResolverRule.html">AssociateResolverRule</a>, <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_DisassociateResolverRule.html">DisassociateResolverRule</a>, or <a href="https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_ListResolverRuleAssociations.html">ListResolverRuleAssociations</a> request, provides information about an association between a Resolver rule and a VPC. The association determines which DNS queries that originate in the VPC are forwarded to your network. '
    Name:
      type: string
      pattern: (?!^[0-9]+$)([a-zA-Z0-9\-_' ']+)
      maxLength: 64
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
