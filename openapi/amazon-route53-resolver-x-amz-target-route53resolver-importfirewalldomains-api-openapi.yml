security:
- hmac: []
tags:
- name: '#X Amz Target=Route53Resolver.ImportFirewallDomains'
paths:
  /#X-Amz-Target=Route53Resolver.ImportFirewallDomains:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ImportFirewallDomains
      description: 'Imports domain names from a file into a domain list, for use in a DNS firewall rule group.


        Each domain specification in your domain list must satisfy the following requirements:


        It can optionally start with * (asterisk).


        With the exception of the optional starting asterisk, it must only contain the following characters: A-Z, a-z, 0-9, - (hyphen).


        It must be from 1-255 characters in length.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFirewallDomainsResponse'
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
        '484':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '485':
          description: InternalServiceErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceErrorException'
        '486':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportFirewallDomainsRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - Route53Resolver.ImportFirewallDomains
      tags:
      - '#X Amz Target=Route53Resolver.ImportFirewallDomains'
      summary: Import firewall domains
      x-summary-source: derived
components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    FirewallDomainImportOperation:
      type: string
      enum:
      - REPLACE
    ImportFirewallDomainsRequest:
      type: object
      required:
      - FirewallDomainListId
      - Operation
      - DomainFileUrl
      title: ImportFirewallDomainsRequest
      properties:
        FirewallDomainListId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the domain list that you want to modify with the import operation.
        Operation:
          allOf:
          - $ref: '#/components/schemas/FirewallDomainImportOperation'
          - description: 'What you want DNS Firewall to do with the domains that are listed in the file. This must be set to <code>REPLACE</code>, which updates the domain list to exactly match the list in the file. '
        DomainFileUrl:
          allOf:
          - $ref: '#/components/schemas/DomainListFileUrl'
          - description: <p>The fully qualified URL or URI of the file stored in Amazon Simple Storage Service (Amazon S3) that contains the list of domains to import.</p> <p>The file must be in an S3 bucket that's in the same Region as your DNS Firewall. The file must be a text file and must contain a single domain per line.</p>
    ConflictException: {}
    InternalServiceErrorException: {}
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
    DomainListFileUrl:
      type: string
      minLength: 1
      maxLength: 1024
    ValidationException: {}
    ImportFirewallDomainsResponse:
      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The Id of the firewall domain list that DNS Firewall just updated.
        Name:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: 'The name of the domain list. '
        Status:
          allOf:
          - $ref: '#/components/schemas/FirewallDomainListStatus'
          - description: Status of the import request.
        StatusMessage:
          allOf:
          - $ref: '#/components/schemas/StatusMessage'
          - description: Additional information about the status of the list, if available.
    LimitExceededException: {}
    Name:
      type: string
      pattern: (?!^[0-9]+$)([a-zA-Z0-9\-_' ']+)
      maxLength: 64
    StatusMessage:
      type: string
      maxLength: 255
    FirewallDomainListStatus:
      type: string
      enum:
      - COMPLETE
      - COMPLETE_IMPORT_FAILED
      - IMPORTING
      - DELETING
      - UPDATING
    ThrottlingException: {}
    ResourceNotFoundException: {}
    AccessDeniedException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/route53resolver/
x-hasEquivalentPaths: true
