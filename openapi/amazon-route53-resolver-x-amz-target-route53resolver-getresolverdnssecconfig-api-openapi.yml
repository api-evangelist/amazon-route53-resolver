      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID for a configuration for DNSSEC validation.
        OwnerId:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - description: The owner account ID of the virtual private cloud (VPC) for a configuration for DNSSEC validation.
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The ID of the virtual private cloud (VPC) that you're configuring the DNSSEC validation status for.
        ValidationStatus:
          allOf:
          - $ref: '#/components/schemas/ResolverDNSSECValidationStatus'
          - description: <p>The validation status for a DNSSEC configuration. The status can be one of the following:</p> <ul> <li> <p> <b>ENABLING:</b> DNSSEC validation is being enabled but is not complete.</p> </li> <li> <p> <b>ENABLED:</b> DNSSEC validation is enabled.</p> </li> <li> <p> <b>DISABLING:</b> DNSSEC validation is being disabled but is not complete.</p> </li> <li> <p> <b>DISABLED</b> DNSSEC validation is disabled.</p> </li> </ul>
      description: A complex type that contains information about a configuration for DNSSEC validation.
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
    InternalServiceErrorException: {}
    InvalidRequestException: {}
    ResolverDNSSECValidationStatus:
      type: string
      enum:
      - ENABLING
      - ENABLED
      - DISABLING
      - DISABLED
      - UPDATING_TO_USE_LOCAL_RESOURCE_SETTING
      - USE_LOCAL_RESOURCE_SETTING
