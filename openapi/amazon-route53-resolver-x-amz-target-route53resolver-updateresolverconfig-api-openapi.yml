    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateResolverConfig
      description: Updates the behavior configuration of Route 53 Resolver behavior for a single VPC from Amazon Virtual Private Cloud.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResolverConfigResponse'
        '480':
