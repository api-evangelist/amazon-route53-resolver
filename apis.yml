name: Amazon Route 53 Resolver
description: >-
  Amazon Route 53 Resolver provides DNS resolution for hybrid cloud environments, enabling DNS queries between your VPCs
  and on-premises networks. It allows you to configure DNS forwarding rules, manage resolver endpoints, and set up
  conditional forwarding to resolve domain names across your hybrid infrastructure seamlessly.
